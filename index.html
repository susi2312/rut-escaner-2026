<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>RUT - Acreditación</title>

<script src="https://unpkg.com/html5-qrcode"
        type="text/javascript"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #f4ece7;
  font-family: Arial, sans-serif;
  color: #333;
}

.contenedor {
  max-width: 620px;
  margin: auto;
}

.tarjeta {
  background: #ffffff;
  border-radius: 24px;
  padding: 26px;
  box-shadow: 0 8px 30px rgba(0,0,0,.14);
}

.logo {
  text-align: center;
  font-size: 42px;
  font-weight: bold;
  letter-spacing: 3px;
  color: #8b5e3c;
}

.titulo {
  text-align: center;
  font-size: 26px;
  margin-top: 5px;
  color: #444;
}

.evento {
  text-align: center;
  color: #777;
  margin-bottom: 22px;
}

.puesto {
  text-align: center;
  background: #faf5f0;
  padding: 12px;
  border-radius: 12px;
  margin-bottom: 20px;
}

#reader {
  width: 100%;
  max-width: 500px;
  margin: auto;
}

.estado {
  margin-top: 18px;
  padding: 15px;
  border-radius: 12px;
  text-align: center;
  font-weight: bold;
  background: #f5f5f5;
}

.exito {
  background: #edf8f1;
  color: #26734d;
}

.error {
  background: #fff0f0;
  color: #b00020;
}

.resultado {
  display: none;
  margin-top: 22px;
  padding: 22px;
  border-radius: 18px;
  background: #faf8f6;
  border: 1px solid #eaded5;
}

.resultado h2 {
  text-align: center;
  margin-top: 0;
  color: #8b5e3c;
}

.nombre {
  text-align: center;
  font-size: 28px;
  font-weight: bold;
  margin: 15px 0 5px;
}

.id {
  text-align: center;
  color: #777;
  margin-bottom: 22px;
}

.dato {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  padding: 12px 0;
  border-bottom: 1px solid #e8e0db;
}

.dato:last-child {
  border-bottom: none;
}

.valor {
  font-weight: bold;
  text-align: right;
}

.acreditada {
  margin-top: 18px;
  padding: 15px;
  border-radius: 12px;
  text-align: center;
  font-weight: bold;
}

.no-acreditada {
  background: #edf8f1;
  color: #26734d;
}

.ya-acreditada {
  background: #fff5df;
  color: #9a6700;
}

button {
  width: 100%;
  margin-top: 20px;
  padding: 15px;
  border: none;
  border-radius: 13px;
  background: #8b5e3c;
  color: white;
  font-size: 17px;
  font-weight: bold;
}

button:active {
  transform: scale(.98);
}

</style>

</head>


<body>


<div class="contenedor">

<div class="tarjeta">


<div class="logo">
RUT
</div>


<div class="titulo">
Acreditación
</div>


<div class="evento">
Congreso Mujer Bella 2026
</div>


<div class="puesto">

<b>Puesto:</b>

<span id="puesto">
P1
</span>

</div>


<div
id="estado"
class="estado">

Preparando cámara...

</div>


<div id="reader"></div>


<div
id="resultado"
class="resultado">

<h2>
Participante encontrada
</h2>


<div
id="nombre"
class="nombre">
-
</div>


<div
id="idRut"
class="id">
-
</div>


<div class="dato">

<span>
Estado
</span>

<span
id="estadoParticipante"
class="valor">
-
</span>

</div>


<div class="dato">

<span>
Tipo
</span>

<span
id="tipoParticipante"
class="valor">
-
</span>

</div>


<div class="dato">

<span>
Meeting
</span>

<span
id="meeting"
class="valor">
-
</span>

</div>


<div class="dato">

<span>
Escuelita
</span>

<span
id="escuelita"
class="valor">
-
</span>

</div>


<div
id="estadoAcreditacion"
class="acreditada no-acreditada">

Participante no acreditada

</div>


</div>


<button
id="btnNuevo"
style="display:none;">

📷 Escanear otro QR

</button>


</div>

</div>


<script>


/*
 * =====================================================
 * CONFIGURACIÓN
 * =====================================================
 */


const API_URL =
"https://script.google.com/macros/s/AKfycby93BZkH7rTmZqHv6UFoNmOop6L9VGCZChI8z-3XDAjjaHlqOSYRZaWnUSGxhBnX2q5Vg/exec";


let scanner = null;

let procesando = false;


const estado =
document.getElementById("estado");

const resultado =
document.getElementById("resultado");

const nombre =
document.getElementById("nombre");

const idRut =
document.getElementById("idRut");

const estadoParticipante =
document.getElementById("estadoParticipante");

const tipoParticipante =
document.getElementById("tipoParticipante");

const meeting =
document.getElementById("meeting");

const escuelita =
document.getElementById("escuelita");

const estadoAcreditacion =
document.getElementById("estadoAcreditacion");

const btnNuevo =
document.getElementById("btnNuevo");


/*
 * =====================================================
 * INICIAR ESCÁNER
 * =====================================================
 */


function iniciarEscaner() {


procesando = false;


estado.textContent =
"Solicitando acceso a la cámara...";

estado.className =
"estado";


scanner =
new Html5Qrcode("reader");


scanner.start(

{
facingMode: "environment"
},

{
fps: 10,

qrbox: {
width: 250,
height: 250
}

},

qrDetectado,

errorLectura

)

.then(function() {

estado.textContent =
"📷 Cámara activa. Apuntá al código QR.";

estado.className =
"estado";

})

.catch(function(error) {

console.error(error);

estado.innerHTML =
"❌ No se pudo activar la cámara.<br><br>" +
error;

estado.className =
"estado error";

});

}


/*
 * =====================================================
 * QR DETECTADO
 * =====================================================
 */


function qrDetectado(texto) {


if (procesando) {
return;
}


procesando = true;


estado.textContent =
"🔎 QR leído. Consultando Rut...";

estado.className =
"estado";


detenerEscaner()
.then(function() {

consultarParticipante(texto);

});

}


/*
 * =====================================================
 * DETENER ESCÁNER
 * =====================================================
 */


function detenerEscaner() {


if (!scanner) {

return Promise.resolve();

}


return scanner.stop()

.then(function() {

return scanner.clear();

})

.catch(function(error) {

console.error(
"Error al detener cámara:",
error
);

});

}


/*
 * =====================================================
 * ERROR DE LECTURA
 * =====================================================
 */


function errorLectura(error) {

// No mostramos errores individuales.
// El lector continúa buscando.


}


/*
 * =====================================================
 * PROCESAR QR
 * =====================================================
 */


function consultarParticipante(texto) {


const partes =
String(texto).split("|");


if (
partes.length < 5 ||
partes[0] !== "RUT" ||
partes[3] !== "ID"
) {


estado.textContent =
"⚠️ El QR no pertenece al sistema Rut.";

estado.className =
"estado error";


btnNuevo.style.display =
"block";


return;

}


const id =
String(partes[4]).trim();


if (!id) {


estado.textContent =
"❌ El QR no contiene ID de participante.";

estado.className =
"estado error";


btnNuevo.style.display =
"block";


return;

}


const url =
API_URL +
"?modulo=api" +
"&accion=buscar" +
"&id=" +
encodeURIComponent(id);


fetch(url)


.then(function(response) {

if (!response.ok) {

throw new Error(
"HTTP " + response.status
);

}

return response.json();

})


.then(function(data) {

mostrarParticipante(data);

})


.catch(function(error) {

console.error(
"Error consultando Rut:",
error
);


estado.innerHTML =
"❌ No se pudo consultar el participante.<br><br>" +
error;


estado.className =
"estado error";


btnNuevo.style.display =
"block";

});

}


/*
 * =====================================================
 * MOSTRAR PARTICIPANTE
 * =====================================================
 */


function mostrarParticipante(data) {


if (
!data ||
data.resultado !== "OK"
) {


estado.textContent =
data && data.mensaje
? data.mensaje
: "Participante no encontrada.";

estado.className =
"estado error";


btnNuevo.style.display =
"block";


return;

}


nombre.textContent =
data.nombre || "-";


idRut.textContent =
data.idRut || "-";


estadoParticipante.textContent =
data.estado || "-";


tipoParticipante.textContent =
data.tipoParticipante || "-";


meeting.textContent =
data.meeting || "-";


escuelita.textContent =
data.escuelita || "-";


if (data.acreditada) {


estadoAcreditacion.textContent =
"⚠️ Participante ya acreditada";


estadoAcreditacion.className =
"acreditada ya-acreditada";


}

else {


estadoAcreditacion.textContent =
"✅ Participante no acreditada";


estadoAcreditacion.className =
"acreditada no-acreditada";

}


resultado.style.display =
"block";


estado.textContent =
"✅ Participante encontrada";

estado.className =
"estado exito";


btnNuevo.style.display =
"block";

}


/*
 * =====================================================
 * NUEVO ESCANEO
 * =====================================================
 */


btnNuevo.addEventListener(
"click",
function() {


resultado.style.display =
"none";


btnNuevo.style.display =
"none";


nombre.textContent =
"-";


idRut.textContent =
"-";


estadoParticipante.textContent =
"-";


tipoParticipante.textContent =
"-";


meeting.textContent =
"-";


escuelita.textContent =
"-";


estadoAcreditacion.textContent =
"Participante no acreditada";


estadoAcreditacion.className =
"acreditada no-acreditada";


estado.textContent =
"Preparando cámara...";

estado.className =
"estado";


scanner = null;


iniciarEscaner();

});


/*
 * =====================================================
 * INICIO
 * =====================================================
 */


window.addEventListener(
"load",
function() {

iniciarEscaner();

});


</script>


</body>

</html>
