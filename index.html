<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Rut - Prueba de Cámara</title>

<style>

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f3e8ed;
  color: #333;
}

.contenedor {
  max-width: 600px;
  margin: auto;
}

.tarjeta {
  background: white;
  border-radius: 20px;
  padding: 25px;
  box-shadow: 0 8px 25px rgba(0,0,0,.15);
}

h1 {
  text-align: center;
  margin-bottom: 5px;
}

h2 {
  text-align: center;
  font-weight: normal;
  margin-top: 0;
}

.info {
  text-align: center;
  margin: 20px 0;
}

.camara {
  width: 100%;
  height: 350px;
  background: #111;
  border-radius: 16px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none;
}

.placeholder {
  color: white;
  text-align: center;
  font-size: 20px;
}

button {
  width: 100%;
  margin-top: 20px;
  padding: 16px;
  border: none;
  border-radius: 12px;
  background: #8b5e3c;
  color: white;
  font-size: 18px;
}

.estado {
  margin-top: 20px;
  padding: 15px;
  border-radius: 12px;
  background: #f5f5f5;
  text-align: center;
  font-weight: bold;
}

.exito {
  color: #26734d;
}

.error {
  color: #b00020;
}

</style>

</head>

<body>

<div class="contenedor">

<div class="tarjeta">

<h1>RUT</h1>

<h2>Prueba de cámara</h2>

<div class="info">
Congreso Mujer Bella 2026
</div>

<div class="camara">

<div
class="placeholder"
id="placeholder">

📷<br><br>

Cámara esperando...

</div>

<video
id="video"
autoplay
playsinline
muted>
</video>

</div>

<button
id="activar">

📷 Activar cámara

</button>

<div
class="estado"
id="estado">

Esperando autorización...

</div>

</div>

</div>


<script>

const video =
document.getElementById("video");

const boton =
document.getElementById("activar");

const estado =
document.getElementById("estado");

const placeholder =
document.getElementById("placeholder");


let stream = null;


boton.addEventListener(
"click",
activarCamara
);


async function activarCamara() {

estado.textContent =
"Solicitando acceso a la cámara...";

estado.className =
"estado";


try {

stream =
await navigator.mediaDevices.getUserMedia({

video: {
facingMode: {
ideal: "environment"
}
},

audio: false

});


video.srcObject =
stream;


await video.play();


video.style.display =
"block";

placeholder.style.display =
"none";


estado.textContent =
"✅ Cámara funcionando correctamente";

estado.className =
"estado exito";


}


catch(error) {

console.error(error);


estado.innerHTML =
"❌ Error de cámara:<br><br>" +
error.name +
"<br>" +
error.message;


estado.className =
"estado error";

}

}

</script>

</body>

</html>
